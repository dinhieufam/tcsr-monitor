[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcsr-monitor"
version = "0.1.0"
description = "Temporal Conformal Surgical Risk Monitor — real-video failure monitoring for surgical instrument segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "segmentation-models-pytorch>=0.3.3",
    "transformers>=4.40.0",
    "numpy>=1.26.0,<2.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "scikit-image>=0.22.0",
    "opencv-python-headless>=4.9.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "crepes>=0.6.0",
    "mapie>=0.8.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "wandb>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "pre-commit>=3.7.0",
    "nbstripout>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tcsr"]

[tool.hatch.build.targets.editable]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = ["slow: marks tests as slow (deselect with '-m not slow')"]
